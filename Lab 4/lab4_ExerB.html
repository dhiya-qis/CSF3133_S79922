<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>e-Cafe Campus</title>
  <link rel="stylesheet" href="cafe.css">
  <style type="text/css">
  <!-- Navigation bar -- >
  ul {
    list-style-type: none;
    margin: 0;
    padding: 0;}
a:link {color: #1A5276; }
a:visited {color: #7D3C98; }
a:hover {color: #E67E22; }
a:active {color: #C0392B; }
h1 {text-decoration: overline; }
p {color: #333333; text-align: justify;}
#intro {
  font-size: 18px;
  background-color: #FDEBD0;
.highlight {
  font-weight: bold;
  color: #C0392B;
  }
  </style>
</head>
<body>
  <!-- ERROR IDENTIFICATION -->
  <!-- Error 1 (Line 9): list-style-type: no; is invalid change it to none; -->
  <!-- Error 2 (Line 13-16):  Link states in wrong order -->
  <!-- Error 3 (Line 17): text-decoration: overlined; is invalid change it to overline; -->
  <!-- Error 4 (Line 18): missing ":" in color -->
  <!-- Error 5 (Line 22): missing dot at highlight  -->
  <!-- Error 6 (Line 34): missing # at menu -->
  <!-- Error 7 (Line 43 & 47):  duplicate id="item"-->
  <!-- Error 9 (Line 53): missing controls in video  -->
  <!-- Error 10 (Line 54): missing video in type  -->
<header>
    <h1>e-Cafe Campus</h1>
</header>
<nav>
    <ul>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#video">Video</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>
<section id="menu">
  <h2>Today's Menu</h2>
  <p class="intro">Freshly brewed coffee and local delights every
day.</p>
  <article class="menu-item">
    <h3>Kopi Tarik</h3>
    <p>Only <span class="highlight">RM 3.50</span></p>
  </article>
  <article  class="menu-item">
    <h3>Nasi Lemak</h3>
    <p>Only <span class="highlight">RM 5.00</span></p>
  </article>
</section>
<section id="video">
    <h2>Watch Our Story</h2>
    <video width="400" height="300" controls>
        <source src="cafe.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</section>
<footer id="contact">
    <p>&copy; 2026 e-Cafe Campus</p>
</footer>
</body>
</html>
